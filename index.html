<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotVerse Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111827; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1f2937; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); width: 100%; max-width: 400px; }
        h1 { text-align: center; color: #60a5fa; margin-top: 0; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, textarea { width: 100%; padding: 8px; margin-bottom: 15px; background: #374151; border: 1px solid #4b5563; border-radius: 4px; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .status { margin-top: 15px; padding: 10px; background: #374151; border-radius: 4px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>BotVerse Dashboard</h1>
        <label>Target Group URL</label>
        <input type="text" id="url" placeholder="https://facebook.com/groups/...">
        
        <label>Cookies (JSON Array)</label>
        <textarea id="cookies" rows="3" placeholder="[]"></textarea>
        
        <button onclick="startCampaign()">Start Campaign</button>
        <div class="status" id="status">Status: Idle</div>
    </div>

    <script>
        async function startCampaign() {
            const url = document.getElementById('url').value;
            const cookies = document.getElementById('cookies').value;
            const statusDiv = document.getElementById('status');
            
            statusDiv.innerText = "Status: Loading...";

            try {
                const response = await fetch("http://localhost:8000/api/start-campaign", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        target_url: url,
                        cookies: cookies ? JSON.parse(cookies) : []
                    })
                });
                const data = await response.json();
                if (response.ok) {
                    statusDiv.innerText = "Status: Success! Leads: " + data.result.leads_count;
                } else {
                    statusDiv.innerText = "Status: Error: " + data.detail;
                }
            } catch (error) {
                statusDiv.innerText = "Status: Error: " + error.message;
            }
        }
    </script>
</body>
</html>
